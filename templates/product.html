{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product_list</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <style>
        body{ font-family: sans-serif;margin: 20px;background: #f0f2f5;}
        .product_card{
            background: #fff; padding: 20px; border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin: 10px;
        }
        .product_container{ display: flex; flex-wrap: wrap;}
        .product_card form { margin-top: 10px;}
        .product_card input[type="number"] { width: 50px; padding: 5px;}
        a.button{ display: inline-block; padding: 10px 15px; background: #007bff ; color:white;
        border-radius: 5px; text-decoration: none; }
    </style>
</head>
<body>
<h1>Product List</h1>
<div class="product_container">
    {% for product in products %}
    <div class="product_card">

        <div class="card" style="width: 18rem;">
  <img src="{{ product.image }}" class="card-img-top" alt="...">
  <div class="card-body">
    <h5 class="card-title">{{ product.name }}</h5>
    <p class="card-text">{{ product.price }}</p>


        <form action="" method="post">
            {% csrf_token %}
            <label>Qty:</label>
            <input type="number" name="quantity" value="1" min="1">
              <a href="{% url 'add_to_cart' product.id %}" class="btn btn-primary">Add to Cart</a>
        </form>

  </div>
</div>

    </div>
    {% endfor %}
    <br>
    <a href="{% url 'view_cart' %}" class="button">View Cart </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>

</body>
</html>

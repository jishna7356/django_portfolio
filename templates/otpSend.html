{% load static %}
<!document html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            padding-top:90px;
        }

        .main_div{
            width:350px;
            height:300px;
            background:#ffffff;
            border-radius:10px;
            padding:30px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        h2{
            color:#002c3e;
            margin-bottom:10px;
        }

        p{
            margin-left:-180px;
            /* margin-top: -px; */
            margin-bottom: -10px;
            font-size:14px;
            color:#555;
            margin-bottom:25px;
            gap: 0px;
        }

        input{
            width:320px;
            padding:12px;
            font-size:14px;
            border:1px solid #cfcaca;
            border-radius:5px;
            outline:none;
            background-color: #e4dede;

        }
        /* input:hover{
            border-color: #f7444e;

        } */


        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            background:#f7444e;
            color:#fff;
            border:none;
            border-radius:4px;
            font-size:15px;
            cursor:pointer;
            border-radius: 5px;
        }

        button:hover{
            background:#d93b44;
        }
        .p-last{
            margin-left: -85px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<div class="main_div">
    <h2>Login </h2>
    <p>Enter your registered email </p>

    <form method="post">
        {% csrf_token %}
        <input  id="address" type="email" placeholder="email" name="email" required>

        <button type="submit">Send OTP</button>
    </form>
        <p class="p-last"><b>We will send a 6-digit OTP to your email</b></p>
</div>

</body>
</html>

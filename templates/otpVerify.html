{% load static %}
<!document html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            padding-top:90px;
        }

        .main_div{
            width:350px;
            height:330px;
            background:#ffffff;
            border-radius:10px;
            padding:30px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            text-align:center;
        }

        h2{
            color:#002c3e;
            margin-bottom:10px;
        }

        p{
            font-size:14px;
            color:#555;
            /* margin-bottom:25px;
              margin-left:-90px; */
        }

        .otp-box{
            display:flex;
            justify-content:space-between;
        }

        .otp-box input{
            width:310px;
            height:40px;
            text-align:center;
            font-size:18px;
            border:1px solid #ccc;
            border-radius:5px;
            outline:none;
             background-color: #e4dede;

        }



        button{
            width:320px;
            margin-top:30px;
            padding:12px;
            background:#f7444e;
            color:#fff;
            border:none;
            border-radius:6px;
            font-size:15px;
            cursor:pointer;
        }

        button:hover{
            background:#d93b44;
        }

        .resend{
            margin-top:30px;
            font-size:13px;
            color:#555;
        }

        .resend a{
            color:#f7444e;
            cursor:pointer;
            text-decoration: none;
        }
        .resend p{
            margin-top: -100px;
            margin-left: -10px;
        }
    </style>
</head>
<body>

<div class="main_div">
    <h2>Verify OTP</h2>
    <p>Enter the 6-digit OTP sent to your email</p>

    <div class="otp-box">
            <form method="post">
                    {% csrf_token %}

                    <input name="otp" type="text" maxlength="6">


                    <button type="submit">Verify </button>
    </div>

            </form>



     <div class="resend">
       <p ><b> Didn’t receive OTP?</b> <a href="">Resend</a></p>

    </div>
</div>

</body>
</html>
